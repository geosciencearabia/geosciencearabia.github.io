<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoscience Arabia | Coming Soon</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Teal/Geoscience accent vibe
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom background mesh/blur effect for modern SaaS look */
        .bg-mesh {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(173, 100%, 96%, 1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(210, 100%, 98%, 1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(173, 100%, 96%, 1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(210, 100%, 98%, 1) 0px, transparent 50%);
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 bg-mesh min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-900">

    <!-- Animated Background Canvas -->
    <canvas id="particle-canvas" class="fixed inset-0 z-0 pointer-events-none w-full h-full"></canvas>

    <!-- Header -->
    <header class="w-full px-6 py-8 md:px-12 lg:px-24 flex justify-end items-center z-10 relative">
        <div class="text-sm font-medium text-slate-500">
            geoarabia.com
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-20 z-10 relative">
        <div class="max-w-4xl mx-auto text-center">
            
            <!-- Small Uppercase Tag -->
            <div class="inline-flex items-center px-3 py-1 rounded-full bg-brand-50 border border-brand-100 mb-8">
                <span class="w-2 h-2 rounded-full bg-brand-500 mr-2 animate-pulse"></span>
                <span class="text-xs font-semibold tracking-widest text-brand-600 uppercase">Platform Preview</span>
            </div>
            
            <!-- Massive Bold Main Headline -->
            <h1 class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-extrabold tracking-tighter text-slate-900 mb-6 leading-none">
                Coming<br class="hidden sm:block" /> Soon.
            </h1>
            
            <!-- Brief Elegant Subheadline -->
            <p class="text-lg sm:text-xl md:text-2xl text-slate-500 max-w-2xl mx-auto mb-10 leading-relaxed font-normal">
                We are building a comprehensive digital platform for the geosciences community in the region. The future of geological insights is almost here.
            </p>
            
            <!-- Prominent Contact Button -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="mailto:info@geoarabia.com" class="inline-flex items-center justify-center px-8 py-4 text-base font-medium text-white bg-slate-900 hover:bg-brand-600 rounded-lg transition-all duration-300 shadow-lg hover:shadow-brand-500/25 w-full sm:w-auto group">
                    <svg class="w-5 h-5 mr-2 text-slate-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    info@geoarabia.com
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full px-6 py-8 text-center z-10 relative">
        <p class="text-sm text-slate-400 font-medium">
            &copy; 2026 Geoscience Arabia. All rights reserved.
        </p>
    </footer>

    <!-- Particle Animation Script -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        // Handle resizing
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init(); // Reinitialize particles on resize for better distribution
        }
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Slow, subtle movement
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 2 + 1;
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(20, 184, 166, ${this.alpha})`; // Brand teal color
                ctx.fill();
            }
        }
        
        function init() {
            particles = [];
            // Amount of dots based on screen width to avoid cluttering mobile
            const numParticles = Math.min(Math.floor(window.innerWidth / 18), 80);
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw connecting web/lines for extra SaaS aesthetic
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(20, 184, 166, ${0.1 - distance/120 * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        
        // Start animation
        resize();
        animate();
    </script>
</body>
</html>
