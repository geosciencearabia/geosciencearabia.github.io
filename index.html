<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Geosciences — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050b14;
      --text: #e3f1f5;
      --text-muted: #b5c8d2;
      --text-subtle: #9fb6c3;
      --accent: #3ee6f0;
      --accent-hover: #e879f9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    ::selection { background: var(--accent); color: var(--bg); }

    /* ---------- Background layers ---------- */
    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .layer--vignette {
      background: radial-gradient(
        ellipse at 50% 40%,
        rgba(5, 11, 20, .55) 0%,
        rgba(5, 11, 20, .35) 45%,
        rgba(5, 11, 20, .9) 100%
      );
    }

    .layer--grid {
      background-image:
        linear-gradient(rgba(62, 230, 240, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 230, 240, .035) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    /* ---------- Content ---------- */
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vw, 36px);
      padding: clamp(32px, 6vw, 72px) clamp(20px, 5vw, 56px);
      text-align: center;
      animation: rise .8s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Logo: no glow / lighting, no cropping. The full GIF is shown as-is. */
    .brand__logo-wrap {
      flex-shrink: 0;
    }

    .brand__logo {
      display: block;
      height: clamp(64px, 8vw, 80px);
      width: auto;
    }

    .brand__name {
      font-weight: 900;
      font-size: clamp(18px, 2.2vw, 22px);
      letter-spacing: -.01em;
    }

    .title {
      margin: 0;
      font-weight: 500;
      font-size: clamp(48px, 9vw, 120px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .title span { color: var(--accent); }

    .description {
      margin: 0;
      max-width: 620px;
      font-size: clamp(16px, 1.6vw, 19px);
      line-height: 1.65;
      color: var(--text-muted);
      text-wrap: pretty;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: .2em;
      color: var(--accent);
    }

    .status__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.6s infinite;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 14px;
      color: var(--text-subtle);
    }

    .contact svg { display: block; }

    .contact a {
      color: var(--text);
      font-weight: 500;
    }

    .contact a:hover { color: var(--accent); }

    /* ---------- Animations ---------- */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: .2; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content, .status__dot { animation: none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="layer layer--vignette"></div>
    <div class="layer layer--grid"></div>

    <main class="content">
      <div class="brand">
        <div class="brand__logo-wrap">
          <!-- Save the attached GIF as images/logo.gif next to this file -->
          <img class="brand__logo" src="images/logo.gif" alt="Digital Geosciences">
        </div>
        <div class="brand__name">Digital Geosciences</div>
      </div>

      <h1 class="title">Coming <span>Soon</span></h1>

      <p class="description">
        Thank you for visiting this website! We appreciate your patience and look forward to introducing our
        new features shortly.
      </p>

      <div class="status">
        <span class="status__dot"></span>
        UPGRADE IN PROGRESS
      </div>

      <div class="contact">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ee6f0"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 7l9 6 9-6"></path>
        </svg>
        <span>Contact us:</span>
        <a href="mailto:info@digitalgeosciences.com">info@digitalgeosciences.com</a>
      </div>
    </main>
  </div>

  <script>
    (() => {
      // ---------- Settings ----------
      const PALETTE = 'Aurora';   // 'Aurora' | 'Canyon' | 'Terrain'
      const SPEED = 1;            // 0 – 3
      const DENSITY = 1;          // 0.5 – 1.8

      const PALETTES = {
        Aurora:  { low: [40, 70, 210], mid: [62, 230, 240],  high: [232, 121, 249] },
        Canyon:  { low: [40, 70, 90],  mid: [120, 190, 200], high: [230, 245, 250] },
        Terrain: { low: [30, 90, 200], mid: [60, 220, 140],  high: [250, 80, 110] },
      };

      // ---------- Setup ----------
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      const palette = PALETTES[PALETTE] || PALETTES.Aurora;

      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Mouse parallax (smoothed toward target each frame)
      let mouseX = 0, mouseY = 0;
      let targetX = 0, targetY = 0;
      window.addEventListener('mousemove', (e) => {
        targetX = e.clientX / width - 0.5;
        targetY = e.clientY / height - 0.5;
      });

      // Floating particles
      const particles = Array.from({ length: 70 }, () => ({
        x: Math.random(),
        y: Math.random(),
        speed: 0.00004 + Math.random() * 0.00012,
        phase: Math.random() * 6,
      }));

      // ---------- Helpers ----------
      // Deterministic pseudo-random value in [0, 1) for a grid cell
      const hash = (a, b) => {
        const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
        return s - Math.floor(s);
      };

      // Terrain height at (x, z) and time t
      const terrainHeight = (x, z, t) =>
        0.45 * Math.sin(x * 0.5 + t * 0.3) * Math.cos(z * 0.6 - t * 0.25) +
        0.25 * Math.sin(x * 1.1 - z * 0.8 + t * 0.5) +
        0.10 * Math.sin(x * 2.3 + z * 1.7) +
        1.10 * Math.exp(-((x - 2.4) ** 2 + (z - 5.5) ** 2) / 1.6) -
        0.50 * Math.exp(-((x - 2.4) ** 2 + (z - 5.5) ** 2) / 0.25);

      const lerpColor = (a, b, k) => [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k,
      ];

      // ---------- Render loop ----------
      const Z_NEAR = 1.2;
      const Z_FAR = 11;
      const CAMERA_HEIGHT = 1.3;

      let time = 0;
      let lastFrame = performance.now();

      function buildGrid(cols, rows, focal, horizon, scanZ) {
        const grid = [];
        for (let r = 0; r < rows; r++) {
          const z = Z_FAR - Math.pow(r / (rows - 1), 1.2) * (Z_FAR - Z_NEAR);
          const row = [];

          for (let c = 0; c < cols; c++) {
            const x = (c / (cols - 1) - 0.5) * 16 + mouseX * 1.5;
            const y = terrainHeight(x, z + time * 0.4, time);

            // Perspective projection
            const sx = width / 2 + (x - mouseX * 1.5 * 0.2) / z * focal;
            const sy = horizon + (CAMERA_HEIGHT - y) / z * focal * 0.55;

            // Color by height
            const h = Math.max(0, Math.min(1, (y + 0.6) / 1.9));
            const color = h < 0.5
              ? lerpColor(palette.low, palette.mid, h * 2)
              : lerpColor(palette.mid, palette.high, (h - 0.5) * 2);

            const fade = Math.pow(1 - (z - Z_NEAR) / (Z_FAR - Z_NEAR), 0.8);
            const scanBoost = Math.exp(-((z - scanZ) ** 2) * 1.5);

            row.push({ sx, sy, color, fade, scanBoost });
          }
          grid.push(row);
        }
        return grid;
      }

      function drawRows(grid, cols, rows) {
        ctx.lineWidth = 0.6;
        for (let r = 0; r < rows; r++) {
          const row = grid[r];
          ctx.beginPath();
          row.forEach((p, c) => (c ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy)));

          const { fade, scanBoost } = row[0];
          const alpha = 0.05 + fade * 0.12 + scanBoost * 0.35;
          ctx.strokeStyle = `rgba(${palette.mid.join(',')},${alpha})`;
          ctx.stroke();
        }
      }

      function drawConnectors(grid, cols, rows) {
        ctx.beginPath();
        for (let r = 0; r < rows - 1; r++) {
          for (let c = 0; c < cols - 1; c++) {
            const n = hash(r, c);
            let a, b;

            if (n < 0.14) {            // diagonal ↘
              a = grid[r][c];
              b = grid[r + 1][c + 1];
            } else if (n > 0.9) {      // diagonal ↙
              a = grid[r][c + 1];
              b = grid[r + 1][c];
            } else if (c % 3 === 0) {  // vertical
              a = grid[r][c];
              b = grid[r + 1][c];
            } else {
              continue;
            }
            ctx.moveTo(a.sx, a.sy);
            ctx.lineTo(b.sx, b.sy);
          }
        }
        ctx.strokeStyle = `rgba(${palette.mid.join(',')},0.07)`;
        ctx.stroke();
      }

      function drawPoints(grid, cols, rows) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const { sx, sy, color, fade, scanBoost } = grid[r][c];
            const alpha = Math.min(1, 0.15 + fade * 0.6 + scanBoost * 0.4);
            const size = 0.8 + fade * 1.6 + scanBoost * 1.4;
            ctx.fillStyle = `rgba(${color[0] | 0},${color[1] | 0},${color[2] | 0},${alpha})`;
            ctx.fillRect(sx - size / 2, sy - size / 2, size, size);
          }
        }
      }

      function drawParticles(dt) {
        for (const p of particles) {
          p.y -= p.speed * dt * SPEED;
          if (p.y < 0) {
            p.y = 1;
            p.x = Math.random();
          }
          const twinkle = 0.25 + 0.5 * Math.abs(Math.sin(time * 2 + p.phase));
          const edgeFade = p.y < 0.6 ? p.y / 0.6 : 1;
          ctx.fillStyle = `rgba(${palette.high.join(',')},${twinkle * edgeFade * 0.6})`;
          ctx.fillRect(p.x * width, p.y * height * 0.7, 2, 2);
        }
      }

      function frame(now) {
        const dt = Math.min(50, now - lastFrame);
        lastFrame = now;
        time += dt * 0.001 * SPEED;

        mouseX += (targetX - mouseX) * 0.04;
        mouseY += (targetY - mouseY) * 0.04;

        const cols = Math.max(20, Math.round(60 * DENSITY));
        const rows = Math.max(12, Math.round(32 * DENSITY));
        const focal = Math.max(width, height * 1.4) * 0.55;
        const horizon = height * 0.38 + mouseY * 24;
        const scanZ = Z_NEAR + ((time * 0.12) % 1) * (Z_FAR - Z_NEAR);

        ctx.clearRect(0, 0, width, height);

        const grid = buildGrid(cols, rows, focal, horizon, scanZ);
        drawRows(grid, cols, rows);
        drawConnectors(grid, cols, rows);
        drawPoints(grid, cols, rows);
        drawParticles(dt);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
